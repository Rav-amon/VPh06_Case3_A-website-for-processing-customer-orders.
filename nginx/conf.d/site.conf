# Публичный вход сайта. База и backend с этого адреса напрямую не доступны.
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/html text/css application/json application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        limit_req zone=site burst=20 nodelay;
        default_type application/json;
        return 503 '{"code":"backend_unavailable","message":"Backend ещё не подключён","details":null}';

        # Когда сервис backend будет в compose, заменить блок выше на:
        # resolver 127.0.0.11 valid=10s ipv6=off;
        # set $backend_upstream http://backend:3000;
        # proxy_pass $backend_upstream;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=site burst=20 nodelay;
        root /usr/share/nginx/html;
        index index.html;
    }
}
