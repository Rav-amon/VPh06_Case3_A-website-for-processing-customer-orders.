# Публичный вход сайта. База и backend с этого адреса напрямую не доступны.
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/html text/css application/json application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Снаружи только форма, авторизация админки и защищённые админ-методы.
    location ~ ^/api/v1/health/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/auth/bootstrap-status/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/auth/(register|login)/?$ {
        limit_req zone=site burst=10 nodelay;
        limit_except POST { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/auth/me/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/stats/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/leads/[0-9]+/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET PUT DELETE { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/leads/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET POST { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/applications/[0-9]+/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/applications/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/behavior/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except POST { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/behavior-metrics/?$ {
        limit_req zone=site burst=30 nodelay;
        limit_except GET POST { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location ~ ^/api/v1/admin-settings/?$ {
        limit_req zone=site burst=20 nodelay;
        limit_except GET PUT POST DELETE { deny all; }
        error_page 403 = @api_closed;
        error_page 502 504 = @api_unavailable;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location /api/ {
        limit_req zone=site burst=20 nodelay;
        default_type application/json;
        return 404 '{"data":null,"error":{"code":"not_found","message":"Снаружи доступны форма, авторизация админки и защищённые админ-методы","details":null},"message":"Снаружи доступны форма, авторизация админки и защищённые админ-методы"}';
    }

    location @api_closed {
        default_type application/json;
        return 403 '{"data":null,"error":{"code":"forbidden","message":"Этот метод снаружи закрыт","details":null},"message":"Этот метод снаружи закрыт"}';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"data":null,"error":{"code":"backend_unavailable","message":"Backend временно недоступен","details":null},"message":"Backend временно недоступен"}';
    }

    location / {
        limit_req zone=site burst=20 nodelay;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
