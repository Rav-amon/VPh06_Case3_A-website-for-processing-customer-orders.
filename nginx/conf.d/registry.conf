# Реестр образов. TLS заканчивается на Nginx, контейнер registry остаётся во внутренней сети.
server {
    listen 5000 ssl;
    server_name 185.182.110.184;

    ssl_certificate /etc/nginx/certs/registry.crt;
    ssl_certificate_key /etc/nginx/certs/registry.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RegistrySSL:10m;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $registry_upstream http://registry:5000;
        proxy_pass $registry_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
