# Autéllo Barskiy.
# Снаружи открыт только Nginx :80 (сайт + узкий /api/ для фронтенда).
# Backend слушает 8000 только внутри Docker (expose), на хост не публикуется.
# Postgres — только сеть data. pgAdmin и registry отключены (profile tools).

# Docker принимает в имени проекта только латиницу в нижнем регистре.
name: autello_barskiy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - edge
      - app
    labels:
      - com.centurylinklabs.watchtower.enable=true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LEADS_APP_USER: ${LEADS_APP_USER}
      LEADS_APP_PASSWORD: ${LEADS_APP_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=-1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Включение: docker compose --profile tools up -d pgadmin
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:9.10
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ALLOW_SAVE_PASSWORD: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - data
      - admin
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Включение: docker compose --profile tools up -d registry
  registry:
    profiles: ["tools"]
    image: registry:2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET}
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Lead Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./registry/htpasswd:/auth/htpasswd:ro
    networks:
      - registry_net
    labels:
      - com.centurylinklabs.watchtower.enable=false

  backend:
    build:
      context: ./backend
      network: host
    image: autello-barskiy-backend:latest
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    # Порт 8000 только внутри сети app. На хост не публикуется.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false

  watchtower:
    image: nickfedor/watchtower:1.24.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: UTC
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  edge:
    name: autello_barskiy_edge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  admin:
    name: autello_barskiy_admin
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  app:
    name: autello_barskiy_app
    internal: true
  data:
    name: autello_barskiy_data
    internal: true
  registry_net:
    name: autello_barskiy_registry
    internal: true

volumes:
  postgres_data:
    name: autello_barskiy_postgres_data
  pgadmin_data:
    name: autello_barskiy_pgadmin_data
  registry_data:
    name: autello_barskiy_registry_data
